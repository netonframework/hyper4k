# 可选：用 `cbindgen --config cbindgen.toml --output include/hyper4k.h` 重新生成头文件。
# 当前仓库里的 include/hyper4k.h 是手写的（注释更友好）；若改了 ABI 可用此配置回灌。
language = "C"
include_guard = "HYPER4K_H"
pragma_once = false
autogen_warning = "/* Generated by cbindgen. Do not edit by hand. */"
style = "type"

[export]
prefix = ""

[parse]
parse_deps = false
