[package]
name = "hyper4k"
version = "0.2.0"
edition = "2021"
description = "High-performance Tokio + Hyper HTTP engine with Kotlin/Native bindings for Neton."
license = "Apache-2.0"
repository = "https://github.com/netonframework/hyper4k"

[lib]
name = "hyper4k"
# staticlib -> 静态链进 Kotlin/Native 二进制（分发最干净）
# cdylib    -> 本地开发 / JVM 侧也能用
crate-type = ["staticlib", "cdylib"]

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util"] }
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
dashmap = "6.2.1"

[dev-dependencies]
# Test-only HTTP/2 client: proving h2c end to end needs a real client handshake,
# not a hand-written preface. Cargo unifies these features into the test build only.
hyper = { version = "1.11.1", features = ["client"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"   # 不让 panic 跨 FFI 边界（UB）；handler 内部错误用状态码表达
strip = true
