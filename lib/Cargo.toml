[package]
name = "hyper4k"
version = "0.1.1"
edition = "2021"
description = "High-performance Tokio + Hyper HTTP engine with Kotlin/Native bindings for Neton."
license = "Apache-2.0"
repository = "https://github.com/netonframework/hyper4k"

[lib]
name = "hyper4k"
# staticlib -> 静态链进 Kotlin/Native 二进制（分发最干净）
# cdylib    -> 本地开发 / JVM 侧也能用
# rlib is additive: it lets integration tests link the crate, and changes
# nothing about the staticlib or cdylib outputs.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util"] }
hyper = { version = "1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
dashmap = "6.2.1"
# Exactly one crypto provider is compiled in. aws-lc-rs is rustls's default and
# leaves room for FIPS and post-quantum later; its non-FIPS build needs a C
# compiler but not cmake (verified on all four target platforms).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"

[dev-dependencies]
# Throwaway CAs and leaf certificates per test: nothing expires in the repo, and
# the "expired certificate" case can be produced deliberately.
rcgen = "0.13"
time = "0.3"
tokio-stream = "0.1"
futures-core = "0.3"

[[bench]]
name = "three_layer"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"   # 不让 panic 跨 FFI 边界（UB）；handler 内部错误用状态码表达
strip = true
